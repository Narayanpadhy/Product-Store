<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Product Inventory</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        background-size: cover;
        background-position: center;
    }

    .login-box {
        width: 350px;
        padding: 40px 35px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #fff;
        text-align: center;
        animation: fadeIn 0.8s ease-in-out;
    }

    h2 {
        margin-bottom: 20px;
        font-size: 26px;
        font-weight: 600;
    }

    .input-field {
        width: 100%;
        margin: 12px 0;
        position: relative;
    }

    .input-field input {
        width: 100%;
        padding: 12px 15px;
        border-radius: 50px;
        border: none;
        outline: none;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
    }

    .input-field input::placeholder {
        color: #eaeaea;
    }

    .login-btn {
        margin-top: 15px;
        width: 100%;
        padding: 10px 0;
        border: none;
        border-radius: 50px;
        background: #ffffff;
        color: #764ba2;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: #f4f4f4;
        transform: translateY(-2px);
    }

    .register-link {
        margin-top: 15px;
        display: block;
        font-size: 14px;
        color: #fff;
        text-decoration: none;
        transition: 0.3s;
    }

    .register-link:hover {
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

</head>
<body>

    <div class="login-box">
        <h2>Welcome Back</h2>

        <form action="login" method="post">

            <div class="input-field">
                <input type="text" name="uname" placeholder="Enter Username" required>
            </div>

            <div class="input-field">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>

            <a href="Register.html" class="register-link">New User? Create Account</a>

        </form>
    </div>

</body>
</html>
