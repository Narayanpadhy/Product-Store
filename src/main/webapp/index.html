<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Access Portal</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #003366, #4e9eff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            z-index: -1;
        }

        body::before {
            top: -150px;
            left: -150px;
            animation: float 15s infinite ease-in-out;
        }

        body::after {
            bottom: -150px;
            right: -150px;
            animation: float 18s infinite ease-in-out reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(20px, 30px) rotate(5deg); }
            50% { transform: translate(-15px, 10px) rotate(-5deg); }
            75% { transform: translate(10px, -20px) rotate(3deg); }
        }

        .main-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 40px;
            width: 850px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            text-align: center;
            color: #fff;
            animation: fadeIn 1.2s ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .main-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #003366, #4e9eff, #003366);
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 5px;
            position: relative;
            display: inline-block;
        }

        .title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            animation: expand 1.5s ease-out;
        }

        @keyframes expand {
            from { width: 0; }
            to { width: 80px; }
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.85;
            margin-bottom: 30px;
            animation: fadeIn 1.5s ease-in-out 0.3s both;
        }

        .options {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .option-card {
            width: 300px;
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: 0.4s ease;
            color: #fff;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: cardSlide 0.8s ease-out both;
        }

        .option-card.admin {
            animation-delay: 0.5s;
        }

        .option-card.customer {
            animation-delay: 0.7s;
        }

        @keyframes cardSlide {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            transform: translateY(100%);
            transition: transform 0.4s ease;
            z-index: 1;
        }

        .option-card:hover::before {
            transform: translateY(0);
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.32);
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        .option-card i {
            font-size: 45px;
            margin-bottom: 15px;
            color: white;
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .option-card:hover i {
            transform: scale(1.1) rotate(5deg);
        }

        .option-card h3 {
            margin: 10px 0;
            font-size: 22px;
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        .option-card p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 18px;
            line-height: 1.4;
            position: relative;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .option-card:hover p {
            opacity: 1;
        }

        .btn {
            display: inline-block;
            padding: 10px 22px;
            background: #ffffff;
            color: #003366;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #003366;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: -1;
        }

        .btn:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn:hover::before {
            transform: translateX(0);
        }

        /* Add floating particles in background */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: floatParticle 15s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
    </style>

</head>

<body>

    <!-- Background particles -->
    <div class="particles" id="particles"></div>

    <div class="main-box">
        <div class="title">Choose User Type</div>
        <div class="subtitle">Login securely and access your dashboard</div>

        <div class="options">

            <div class="option-card admin" onclick="location.href='AdminLogIn.html'">
                <i class="fas fa-user-shield"></i>
                <h3>Administrator</h3>
                <p>Manage products, users, data and system controls.</p>
                <a href="AdminLogIn.html" class="btn">Admin Login</a>
            </div>

            <div class="option-card customer" onclick="location.href='CustomerLogIn.html'">
                <i class="fas fa-user"></i>
                <h3>Customer</h3>
                <p>Browse products, buy items and manage your account.</p>
                <a href="CustomerLogIn.html" class="btn">Customer Login</a>
            </div>

        </div>

    </div>

    <script>
        // Create floating particles
        document.addEventListener('DOMContentLoaded', function() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random properties
                const size = Math.random() * 10 + 5;
                const left = Math.random() * 100;
                const animationDuration = Math.random() * 20 + 10;
                const animationDelay = Math.random() * 5;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.animationDuration = `${animationDuration}s`;
                particle.style.animationDelay = `${animationDelay}s`;
                
                particlesContainer.appendChild(particle);
            }
        });
    </script>

</body>
</html>
